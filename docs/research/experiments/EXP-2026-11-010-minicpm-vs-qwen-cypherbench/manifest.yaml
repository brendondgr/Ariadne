id: EXP-2026-11-010
slug: minicpm-vs-qwen-cypherbench
title: "MiniCPM 4.7 35B against Qwen 3.8 27B on the kill tests' CypherBench part (typed requests and free Cypher/Gremlin)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: 2026-11-15      # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  The operator moved the one open model from Qwen 3.8 27B to MiniCPM 4.7 35B. This runs EXP-2026-11-006 part A (CypherBench, 200 questions; free Cypher, free Gremlin, typed2 and typed3 requests) on MiniCPM with thinking on and off, against Qwen's saved per-question results, after a replay confirms today's evaluation reproduces them. It decides, by a rule fixed in advance, whether to stay on MiniCPM or ask for Qwen back.

hypothesis: >
  Decision rule on the primary arms (typed3-3shot via Cypher, free cypher-3shot; MiniCPM thinking on): ask for Qwen back if either is worse by more than 0.05 with the paired CI upper bound below 0; stay if both within 0.05 or better; otherwise inconclusive. No strong prior on MiniCPM.

