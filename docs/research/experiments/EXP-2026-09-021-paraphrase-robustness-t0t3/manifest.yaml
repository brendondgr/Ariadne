id: EXP-2026-09-021
slug: paraphrase-robustness-t0t3
title: "What the shipped tree extracts under rewording at T0-T3, and whether two built levers close the gap"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-09-15
date_completed: 2026-09-15
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  The operator needs the workbench to work for questions that keep the entity and
  change the wording. Every tier figure on record (EXP-2026-08-020, Arm 0) ran at
  0ae78c19 -- before the name-resolution reorder at 9f02dc6b and before the
  EXP-2026-09-018 repair -- so no measurement describes the shipped tree under
  rewording. This re-baselines T0-T5 on one tree and tests two already-built
  levers against a T0-T3 bar: the schema-derived primitive engine, and the
  rewrite stage that EXP-2026-09-014 refused on a T4/T5 rule. Bears on C-023 and
  on C-021's scope.

hypothesis: >
  H1 the current T3 is >= 0.25 against the recorded 0.0990, because the name
  reorder targets exactly "exact name, no identifier". H2 the primitive engine
  beats templates by >= 0.10 at T1/T2, because it selects on labels and declared
  relations and never reads a verb. H3 the rewrite stage passes a T0-T3 ship rule
  it was never judged against. Falsifiers are in PROTOCOL.md.

