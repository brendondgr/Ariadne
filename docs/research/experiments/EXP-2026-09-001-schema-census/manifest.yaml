id: EXP-2026-09-001
slug: schema-census
title: How many of the question shapes the sources support has any bank asked?
status: complete
date_started: 2026-09-01
date_completed: 2026-09-01
authors: ["brendondgr"]

purpose: >
  Establish the denominator for bank expansion. Every Ariadne question bank
  draws from 16 hand-written categories in holdout_protocol.py; nobody had
  counted how many question shapes the pinned ATT&CK and CAPEC sources actually
  support. Bears on C-025 (no benchmark pairs NL questions with executable gold
  over these taxonomies) and on Q26, and sets the scope for any generated bank.

hypothesis: >
  The 16 categories cover a minority of the available edge types, with the
  shortfall concentrated in Campaign, Analytic and DataComponent relations and
  in CAPEC's non-ChildOf natures. Falsifiable in both directions: if the sources
  supported roughly 16 shapes, bank expansion would be a volume problem only.

