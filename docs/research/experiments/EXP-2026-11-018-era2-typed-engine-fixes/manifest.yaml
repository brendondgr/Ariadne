id: EXP-2026-11-018
slug: era2-typed-engine-fixes
title: "Era 2 Step 8 follow-up 3: six faults in how typed plans are checked and executed, fixed and re-run on EXP-2026-11-015's arms and gates"
status: planned            # planned | running | complete | failed | superseded
date_started: 2026-11-20
date_completed: null
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Follow-up to EXP-2026-11-017. A diagnosis of where the typed hand-off loses to English found six faults in the typed path, none in the model: CWE seeds read as foreign ids; the Gremlin validator checking each union branch from the label where the last branch ended; only the last of several bridged steps on one graph linked to its producer (the others ran unanchored); the join key description teaching the property name `taxonomy` for `taxonomy_name`; same-graph `from_step` and expand-without-path refused instead of applied as the refusal advised; and redundant bridged describes. Fixed, proven on the previously failing items (PROTOCOL, Smoke), re-run. Engineering measurement; no paper claim.

hypothesis: >
  E1: T-lazy dev lost falls by at least 15 against EXP-2026-11-017 (59). E2: T-lazy variants confidently wrong does not rise against EXP-2026-11-017 (52). H1 (harness) holds. Secondary, reported: records_exact with the gold question's own ids removed from both sides (scripts/era2_anchor_exact.py). Predicted: G2 still fails (bar about 21) and G4 variants still fails; G1, G3 fail.

