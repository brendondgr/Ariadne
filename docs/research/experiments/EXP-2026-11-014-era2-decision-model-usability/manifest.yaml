id: EXP-2026-11-014
slug: era2-decision-model-usability
title: "Era 2, after Step 7: what makes the fast decision models usable, one change at a time"
status: planned            # planned | running | complete | failed | superseded
date_started: 2026-11-17
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 7 (EXP-2026-11-013) found the fast decision models pick wrong options, mostly through confusable option text and a forced choice that hides "none of these". This tests, each on its own against Step 7's records as the control, five changes on relation choice (D4) and grounding (D2/D3): plain per-relation readings as option text, one yes/no question per option, a shortlist role with Qwen choosing from the shortlist, a rule filter on target types, and a verifier on Qwen's picks. Every change is scored on one scoreboard (accuracy, none recall, threshold transfer, role, end-to-end accuracy, calls saved). Engineering measurement for the era-2 design; no paper claim.

hypothesis: >
  H1 wording raises pplx D4 accuracy by >=0.05, mostly on shared-description items. H2 yes/no raises none recall by >=0.15 for pplx and d3 at <=0.03 loss on offered items. H3 pplx or d3 holds a D4 gate in some cell of the wording x yes/no 2x2. H4 a fast model shortlists at >=0.95 gold recall with <=3 options and the controller is non-inferior (margin 0.02). H5 the rule filter raises pplx and d3 accuracy by >=0.10 on narrowed items without losing none recall. H6 a verifier on qwen_prob's picks beats its own confidence as a gate.

