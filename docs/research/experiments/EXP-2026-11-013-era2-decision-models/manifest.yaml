id: EXP-2026-11-013
slug: era2-decision-models
title: "Era 2 Step 7: which closed decisions can small decision models own, by role"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-11-16
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 7 tests each closed decision of the era-2 agent in isolation (correct upstream inputs supplied) across four models: Qwen 3.8 27B with reasoning (baseline), Qwen scored by option log-probabilities, pplx-decider and d3-lite. Each gets accuracy, calibration, wrong-at-coverage, option-order flips, latency, threshold transfer over 200 anchor splits, and a role by the agreed rule (alone / gate / second opinion / not used). Phase A: relation choice (D4), grounding and none-of-these (D2/D3). Phases B and C: the exit decision and seven small constructed tests.

hypothesis: >
  D4: decision models competitive on identifier and name tiers, weak on the synonym tier. D2/D3: the LLM with reasoning beats the small models. Exit decision: rules, not models, carry out-of-coverage. Calibration transfer holds on most strata and fails on exact-name questions.

