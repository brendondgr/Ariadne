id: EXP-2026-09-007
slug: holdout-spend
title: "Spending the 288-question holdout: does the arm comparison hold on questions no repair had seen?"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-05
date_completed: 2026-09-05       # null until status is complete/failed
authors: [brendondgr]

purpose: >
  Six system defects and three measurement defects were found and fixed using the
  DEV half of bank.json. Every headline in the paper is measured on the 284
  questions that were used to find them. This spends the 288 held-back questions,
  once, to ask whether those figures are a property of the system or of the
  questions. Supports C-012 and the arm comparison; deliberately does NOT
  strengthen C-021, because both halves share an author.

hypothesis: >
  H1 ordering preserved, generic > deterministic > llm_query, every gap above the
  grader spread. H2 each arm within 0.08 of its dev value and deterministic within
  0.05. H3 the D6 multi-hop reversal reproduces. H4 model-free recall no more than
  0.05 below dev. H5 zero fabricated mappings on the model-free arms. Recorded in
  PROTOCOL.md at 11:00 EDT, before any generic or llm_query holdout answer existed
  and before any holdout judgment of any kind existed.

