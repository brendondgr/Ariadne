id: EXP-2026-09-008
slug: grader-calibration
title: "Which locally available models can resolve differences near the ceiling?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-09-05
date_completed: 2026-09-06 # last calibration sidecar written 03:25:16 (state-gemma26.json); write-up committed 4eb9b91 20:37 (A-1)
authors: [brendondgr]      # git author of 45f3226, 61e2838, 03570c4 and 4eb9b91

purpose: >
  Which locally available models can resolve differences near the ceiling? On
  2026-09-05 gemma4-31B-mtp returned exactly 1.0 on all 150 composerfix answers,
  and a grader with no spread reports a contrast of zero whatever is true. One
  frozen 60-answer set (20 ceiling / 20 mid / 20 low) is graded by every healthy
  local alias under one prompt and one 32,768-token budget, and each model gets
  a pre-registered usable / not-usable verdict. It decides whether C-021 (the
  co-authorship gap, +0.0322 under qwen38-27B-v2 and 0.0000 under
  gemma4-31B-mtp) can get a second opinion from any local model, and it gates
  the later phases of the 2026-09-06 overnight. Incidentally it closes the
  never-tested LLM_THINKING_BUDGET=512 cap on the llm_query arm (30 paired
  cases). Written retrospectively on 2026-09-09 from PROTOCOL.md (A-1).

hypothesis: >
  Pre-registered in PROTOCOL.md on 2026-09-06 00:05 before any judgment existed.
  H1 gemma4-31B-mtp is saturated on the ceiling band (>=95% at exactly 1.0).
  H2 qwen38-27B-v2 emits >=3 distinct values on the ceiling band. H3
  gemma-4-26B-it is genuinely uncertain, the only unpredictable cell. H4 every
  model separates the low band with sd > 0.20. usable_near_ceiling :=
  fraction_at_1 < 0.95 AND distinct_values > 2. Outcome: all four held; H3
  resolved as unusable, and the model also inverts the mid/low ordering.

