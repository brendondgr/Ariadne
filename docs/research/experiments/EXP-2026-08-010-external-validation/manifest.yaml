id: EXP-2026-08-010
slug: external-validation
title: Does Ariadne survive questions it did not co-author?
status: planned          # planned | running | complete | failed | superseded
date_started: 2026-08-21
date_completed: null
authors: ["brendondgr"]

purpose: >
  Every correctness figure this project has published comes from a question bank
  Ariadne co-authored; template banks carry a measured co-authorship bias of
  0.147, and even the LLM-generated banks are schema-aware. This is the first
  measurement on questions written by someone else: two published benchmarks
  (CTIBench cti-ate, AttackQA) whose gold is set-valued ATT&CK identifiers, so
  the metric needs no language-model judge. It answers Q1 and bears on C-003,
  C-012 and C-013.

hypothesis: >
  Pre-registered in PROTOCOL.md section 4. (H1) Plan-given Ariadne recall lands
  within 0.05 of an oracle graph lookup -- the graph holds the answers and
  retrieving them is what the system claims to do. (H2) External questions score
  below the 0.92-1.00 band the internal banks produce, by roughly the measured
  co-authorship bias. (H3) Precision against gold is low for every arm INCLUDING
  the oracle, because ATT&CK 19.0 records more uses than either benchmark's
  snapshot; an oracle as imprecise as Ariadne means staleness, not error.
  (H4) Plan-free scoring falls below plan-given, and the gap measures how much of
  the published accuracy is the plan the bank hands the system.

