id: EXP-2026-09-011
slug: generic-seeded-repeats
title: "How much does the primary result move across seeds?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-09-06
date_completed: 2026-09-07 # extension grading finished 12:59:59 (judge-state-extension.json); six-seed commit e5453fd 13:03 (A-2)
authors: [brendondgr]      # git author of bc95277, 112088b, 923f5bd and e5453fd

purpose: >
  How much does the primary result move across seeds? EXP-2026-09-010 A-2
  established that the generic arm composes its answers with a language model,
  so the paper's headline — generic 0.6546 on the holdout and the +0.1684 gap
  over deterministic (EXP-2026-09-007), and the 0.1623 dev gap (EXP-2026-09-005)
  — came from a single draw of a varying process with no variance estimate.
  Three pre-registered seeded generations (1729 / 20260906 / 424242) on the
  expansion-bank dev half, each graded twice by qwen38-27B-v2 in
  counterbalanced blocks, measure the across-seed spread of the judged score;
  A-1 added three more seeds (31337 / 8675309 / 271828). Outcome: the wording
  moves (EXP-2026-09-010) but the score does not — balanced across-seed SD
  0.0039 on three seeds, 0.0074 on six, against a 0.1623 gap. The paper quotes
  0.0074. Written retrospectively on 2026-09-09 from PROTOCOL.md (A-2).

hypothesis: >
  Pre-registered in PROTOCOL.md on 2026-09-06 before any run. H1 generic >
  deterministic (0.4946) in all runs. H2 across-seed SD of the balanced
  estimate is below 0.03. H3 the +0.1684 holdout gap exceeds three times the
  across-seed SD (falsified by SD >= 0.0561). Outcome: all three hold on three
  seeds (SD 0.0039) and on six (SD 0.0074; lowest seed 0.6363; gap-to-3SD ratio
  7.3:1 on the same-population 0.1623 gap).

