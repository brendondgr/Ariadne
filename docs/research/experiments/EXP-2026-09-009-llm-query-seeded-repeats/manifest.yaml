id: EXP-2026-09-009
slug: llm-query-seeded-repeats
title: "Does the query-writing arm hold its sign across three seeded runs?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-09-06
date_completed: 2026-09-06 # last grading pass finished 22:22:28 (judge-state.json); completion commit 40bebd3 22:26 (A-1)
authors: [brendondgr]      # git author of c8ad1a7, 9f66921 and 40bebd3

purpose: >
  Does the query-writing arm (llm_query) hold its sign across seeded runs?
  Every published llm_query figure rested on one draw, and C-012 (hand-written
  templates beat a model writing the queries) has a holdout margin of 0.0822
  (0.0831 as quoted when this was written; EXP-2026-09-007 A-1). If run-to-run
  spread were of the same order, one draw would not have established the sign.
  Three generations on the expansion-bank dev half (n=284, LLM_SEED 1729 /
  20260906 / 424242), each graded by both local grader families in a
  counterbalanced order, give the across-seed spread and test whether the
  deterministic > llm_query ordering survives under both families. First kill
  gate of the Phase 2 programme (Step 0.1). Written retrospectively on
  2026-09-09 from PROTOCOL.md (A-1).

hypothesis: >
  Pre-registered in PROTOCOL.md on 2026-09-06 before any run. H1 the ordering
  generic > deterministic > llm_query holds in all three runs under both
  grader families. H2 across-seed SD of llm_query judged correctness is below
  0.03. H3 deterministic - llm_query is positive in all three runs under both
  families. Outcome: H2 holds (balanced SD 0.0089); H1 and H3 hold under
  qwen38-27B-v2 (+0.1012) and fail under gemma4-31B-mtp (-0.2885), which
  emitted two distinct values across 852 judgments on this population.

