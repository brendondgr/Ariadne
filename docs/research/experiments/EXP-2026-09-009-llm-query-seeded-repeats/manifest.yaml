# --- LLM / agentic block (delete entirely if no model was in the loop) ---
llm:
  # Generation and grader family 1 are the same served model; family 2 is named
  # by its own response envelope (data/judge-state.json `served`), never the alias (D-028):
  #   generation + family 1 : relay/qwen38-27B-v2@2026-09-06   (alias default-model, :9090)
  #   family 2              : relay/gemma4-31B-mtp@2026-09-06  (alias default-model-2, :9090)
  model: "relay/qwen38-27B-v2@2026-09-06"
  temperature: 0.0
  top_p: 1.0
  max_tokens: 32768        # --llm-max-tokens 32768 for generation (scripts/seeded_repeats.py) and 32768 for every grading pass (PROTOCOL.md)
  prompt_files: []
  prompt_hash: null
  tool_schema_hash: null
  total_input_tokens: null
  total_output_tokens: null
  nondeterminism_note: >
    Provider-side nondeterminism remains even at temperature 0, and EXP-2026-08-019
    showed that pinning the client seed does not reduce spread on a batched
    server. The three runs vary the seed deliberately and record it; the
    reported quantity is the across-run spread (n_runs 3), and a reader who
    repeats this with these seeds should expect the distribution, not the values.

