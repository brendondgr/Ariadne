id: EXP-2026-07-010
slug: independent-eval-baseline
title: First independent cross-model grading pass (the pre-fix committed baseline)
status: superseded
date_started: 2026-07-20
date_completed: 2026-07-20
authors: [brendondgr]

purpose: >
  The first independent check on the pipeline: 120 saved end-to-end answers
  graded by a separate Sonnet 5 agent each, against the question gold assertions
  and full retrieved evidence. Establishes the "before" figure that the eight
  defect fixes were measured against, and the reason cross-model judging was
  adopted for the seven-arm study.

hypothesis: >
  Stated implicitly before the run: that the pipeline's self-judged scores
  (EXP-2026-07-009) overstated answer quality because the grading model was the
  model under test. This was borne out — 0.8946 independent correctness against
  a self-judged picture that looked close to 1.0.

