id: EXP-2026-09-020
slug: plan-source-crossed
title: "Plan source crossed with query engine: does the primitive path still win where production stands?"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-14
date_completed: 2026-09-14 # null until status is complete/failed
authors:
- Claude Opus 5
- brendondgr

purpose: >
  EXP-2026-09-018 measured hand-written templates against schema-derived
  primitives and the primitives won by 0.3480 judged on a sealed set. That
  comparison, like every headline this programme has published, replayed a
  human-authored plan. app.py does not: api/services/query.py calls
  iter_pipeline, so the planner runs. No arm on record was production's
  configuration, because every deterministic-family arm drives
  run_deterministic. This crosses the two variables -- query engine x plan
  source -- so the engine question can be answered where the shipped workbench
  actually stands. It bounds the scope of C-023's margin rather than refuting
  it.

hypothesis: >
  Stated before the run: the primitive engine's advantage would narrow under a
  real planner but remain positive and separable, since the engine comparison
  holds the plan source constant on both sides. The narrowing was predicted; the
  loss of separability was not, and neither was the sign flip on the easy and
  adversarial tiers.

