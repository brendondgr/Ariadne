# --- Results block ---
# Two readings, and the `_prerouting` ones are kept because the difference IS the
# measurement. Before the router was fixed, every kind that HAS an answer was
# already identical between one source and three, and every question that moved
# was an abstention -- so the drop was never a retrieval failure and must not be
# read as one. After the fix, three sources retrieve IDENTICALLY to one on every
# kind and both arms, with zero questions differing in either direction, and the
# single-source baseline is unmoved, which is the check that the new rule is
# inert when there is nothing to choose between.
