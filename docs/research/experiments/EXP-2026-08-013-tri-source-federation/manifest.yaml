# Filled by scripts/new_experiment.py, then completed by hand.
id: EXP-2026-08-013
slug: tri-source-federation
title: Three graph sources at once, and a declared bridge from the customer graph to ATT&CK
status: complete         # phase 1 + its fix; phase 2 bridge built and MEASURED on a 64-question blind bank
date_started: 2026-08-22
date_completed: 2026-08-22
authors: ["brendondgr"]

purpose: >
  Every result this project has recorded was measured with one relevant source
  live at a time. ATT&CK and CAPEC are federated but sit on different backends
  and answer disjoint questions, so the two per-backend URIs could never
  collide and no request ever had to choose between two sources of the same
  kind. The claim a customer cares about -- point this at our graph ALONGSIDE
  the threat catalogues and ask one question -- had never been run. Phase 1
  asks the narrowest honest version and supplies no knowledge of its own: with
  the bank, the gold and the code held identical, what does adding two
  irrelevant sources cost? It bears on C-010 (the machinery is card-driven and
  transfers) and C-015 (federation across engines).

hypothesis: >
  Exploratory on the magnitude, directional on the sign: adding sources was
  expected to cost precision rather than recall, because the deterministic
  router selects sources by keyword overlap and the identity card exposes 72
  labels and 779 property names of ordinary IT English -- a vocabulary that
  overlaps the catalogues by accident. No prediction was registered about which
  question kinds would absorb the cost.

