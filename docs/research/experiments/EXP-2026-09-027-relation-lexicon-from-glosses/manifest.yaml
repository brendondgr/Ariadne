id: EXP-2026-09-027
slug: relation-lexicon-from-glosses
title: "A relation lexicon generated once from each card's glosses, read deterministically at query time (plan Step 8)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-15
date_completed: 2026-09-16
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  54 of the exposed bank's 172 T1/T2 misses bind the anchor and no relation
  because the card carries one gloss sentence per relationship and none of
  the analyst's verbs. This generates, once and offline, the words an analyst
  uses for each declared relationship from the card's own gloss and endpoints,
  filters them against every routing token, commits them, and reads them
  through the existing gloss index. Bears on the T1/T2 exact target and on
  portability: any card with glosses gets the same treatment.

hypothesis: >
  H1 exposed: T1/T2 records_exact +>= 0.05 each over form_execute, relation-
  unbound T1/T2 rows 54 -> <= 20, wrong_entity / catalogue_dump / T6
  unchanged; sealed T3 within -0.02 with no guard rising. Falsifiers in
  PROTOCOL.md.

