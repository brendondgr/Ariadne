id: EXP-2026-09-014
slug: hybrid-rewrite-stage
title: "Does a gated, closed-choice rewrite stage in front of the deterministic engine recover record identity on paraphrased questions without raising confident-and-wrong?"
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-09-08
date_completed: 2026-09-08 # null until status is complete/failed
authors: ["brendondgr"]

purpose: >
  EXP-2026-08-020 showed that the engine's 1.0000 on the 120 gold questions is a
  property of their phrasing: keep the identifier and change a verb and record
  identity falls to 0.50; drop the identifier, 0.24; paraphrase or describe the
  entity, 0.0000 on 208 questions across every arm tried. This experiment adds one
  stage in front of the engine that rewrites a question into a canonical tier-0
  form in the source card's own vocabulary, filling what it can deterministically
  and letting a model choose the rest **only from candidate lists built by the
  shipped name index**, behind a gate that rejects anything off-list or off-card.
  It answers whether that recovers T4/T5 record identity without raising the
  confident-and-wrong rates the project exists to avoid.

hypothesis: >
  Stated before any model run, in PROTOCOL.md. Pre-registered ship rule: T4 and T5
  records_exact both > 0.25 with every T6 metric no worse than Arm 6
  (wrong_entity <= 0.1000, catalogue_dump <= 0.0667). See PROTOCOL.md.

