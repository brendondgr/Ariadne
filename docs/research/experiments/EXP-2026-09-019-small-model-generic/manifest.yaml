statistical_test: >
  Every comparison is paired per question over the same 284-question bank.
  Standard errors: plan effect 0.0262 in both model columns; model effect 0.0
  (authored plan) and 0.0026 (real planner). Separability by the
  |difference| > 2*SE rule EXP-2026-09-018 used: the plan effect is separable in
  both columns, the model effect in neither. Both model-free cells are
  deterministic and were verified byte-reproducible across repeated runs at one
  and four workers, so a difference between them is not run variance. The metric
  is deterministic gold coverage, not a graded score; no judged pass was run.

