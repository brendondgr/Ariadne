# Filled by scripts/new_experiment.py, then by hand as the steps completed.
id: EXP-2026-09-019
slug: small-model-generic
title: Does the Generic tier need a big model, and does it need a planner?
status: running            # planned | running | complete | failed | superseded
date_started: 2026-09-13
date_completed: null
authors: [brendondgr]

purpose: >
  Two questions sit underneath every figure this programme has published and
  neither is answered by any run on record. First, the Generic tier scores
  0.9255 with a 27B model and 0.9205 without one, so the model is worth 0.005 --
  can a 2B model hold that? Second, and cheaper to answer: every headline arm
  replays an authored plan, so 0.92 is the ceiling for retrieval and composition
  GIVEN a correct plan, and nobody has measured what happens when the planner
  actually runs. Step 2 answers the second question; Steps 3-5 answer the first.

hypothesis: >
  Exploratory on the model size. On the planner: pre-registered as a measured
  difference rather than a judgement -- generic_planned minus generic_composed
  on the same 284 development questions, paired per question, with the plan as
  the only variable. A difference inside the grader's own spread would mean the
  authored plan is not carrying the result.

