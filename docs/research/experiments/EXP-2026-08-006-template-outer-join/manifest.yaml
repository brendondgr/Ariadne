id: EXP-2026-08-006
slug: template-outer-join
title: Does the outer-join bridge close the residual blind gap in the default cascade without regressing it?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-08-18
date_completed: 2026-08-18
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  EXP-2026-08-005 closed the direction half of the blind gap and left five
  identifiers that all belonged to one defect: the template bridges are inner
  joins, so an anchor that maps to nothing is dropped. EXP-2026-08-004 proved
  the outer-join fix on the generic branch; this ports it to the default path,
  which is not additive and therefore required a new comparability baseline.
  Bears on C-001, C-003 and C-014.

hypothesis: >
  Stated in EXP-2026-08-005 RESULTS §4 before this ran: the residual five
  identifiers are the join defect, so the port takes the blind set to 1.0000
  with no development regression — the same result the generic branch showed.

