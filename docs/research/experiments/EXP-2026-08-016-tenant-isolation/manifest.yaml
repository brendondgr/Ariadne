id: EXP-2026-08-016
slug: tenant-isolation
title: How much does the safety gate actually block, and can a tenant's graph leak into a catalogue answer?
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-08-24
date_completed: 2026-08-24   # corrected 2026-09-09 (A-2): phase-2 metrics written 14:02, committed f362d3c 14:06, A-1 committed 6ee9f6e 17:23, all 2026-08-24
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  C-008 rests on 17 hand-written probes, and the suite that produced them found
  the only bypass on record, so it partly grades against its own answer key.
  Phase 1 generates a suite two orders of magnitude larger. Phase 2 measures a
  property no gate can see -- whether a tenant's identity graph leaks into a
  catalogue answer -- as a controlled before/after over the source-selection
  rule.

hypothesis: >
  H1: a much larger suite finds bypasses the 17 did not. CONFIRMED -- 15.
  H2: the comparative source-selection rule reduces cross-source leakage
  relative to the absolute rule it replaced. CONFIRMED -- 568 records to 5.
  H3 (pre-registered as a falsifier): a routing regression would be invisible to
  the leak metric. CONFIRMED and reported -- attack_group now routes to identity
  alone and answers nothing.

