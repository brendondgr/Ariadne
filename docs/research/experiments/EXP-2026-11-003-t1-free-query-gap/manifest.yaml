id: EXP-2026-11-003
slug: t1-free-query-gap
title: "Free query writing: model-written Cypher vs model-written Gremlin on CypherBench graphs (kill test T1)"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-11-13
date_completed: 2026-11-14       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Kill test T1. Measures exact-records accuracy of model-written Cypher and Gremlin, 0-shot and 3-shot, on two CypherBench test graphs mirrored into Gremlin.

hypothesis: >
  3-shot Gremlin at least 5 points below 3-shot Cypher, and neither reaches 0.80. Kill rule in PROTOCOL.md.

