id: EXP-2026-09-012
slug: grader-repeatability-retrospective
title: "How much does re-grading the same answers move the reported mean?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-09-07
date_completed: 2026-09-07 # data/recompute-audit.json written 02:53:59; directory created and completed in one commit b3e4bf5 02:54 (A-1)
authors: [brendondgr]      # git author of b3e4bf5

purpose: >
  How much does re-grading the same frozen answers with the same grader family
  move the reported mean? Every judged figure in this record carries a
  bootstrap interval over questions and none carries one over grading passes.
  The project's repeat passes — family comparisons, position counterbalancing,
  spot checks after fixes — are an unexploited replication study sitting in
  docs/evaluation/experiments/**/answers/*.judgment*.json. No new judgment is
  made: scripts/recompute_audit.py recomputes the mean of every (root, arm,
  suffix) cell on disk, cells are grouped by (root, arm, grader family), and
  the population SD across passes is taken for every group with >= 3 passes.
  Outcome: median 0.0066, max 0.0242 over 22 cells; llm_query is the least
  repeatably gradeable arm (~0.02, a fifth to a quarter of C-012's 0.0822
  holdout margin). Written retrospectively on 2026-09-09 from PROTOCOL.md (A-1).

hypothesis: >
  exploratory — no prior hypothesis. Retrospective: the data existed before the
  question was asked. What was fixed before any number was computed (PROTOCOL.md
  §Method): family assignment by suffix, minimum 3 passes per cell, minimum 20
  judgments per pass, population SD, no pooling across roots or arms.

