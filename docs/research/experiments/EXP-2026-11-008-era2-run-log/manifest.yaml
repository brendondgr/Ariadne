id: EXP-2026-11-008
slug: era2-run-log
title: "Era 2 Step 3: the append-only run log and the agent contract (crash, resume, fork, schema, provenance)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: 2026-11-15      # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 3 of the era-2 plan makes every agent run an append-only SQLite event log from which the model's messages are rebuilt before every call, fixes the request and envelope contract (plan v2 section 4) as typed classes with a JSON Schema, and adds a minimal driver so resume, pause-for-clarification and fork are exercised for real. This experiment records the crash sweep, the append overhead, concurrent writers, schema validity over every path (including the 120 recorded era-1 answers through the fast-path adapter) and live runs of Gemma 4 31B through the log, including a live crash and resume.

hypothesis: >
  G1 a run killed after any append resumes to the same envelope (clock keys excluded) with no call logged twice; G2 every envelope validates; G3 every live model_call names its verified served model and token counts. Expectations: median append under 1 ms (E1); 8 concurrent writers gap-free (E2); Gemma answers the canned question through the log 3/3 (E3); a live crash resumes without re-asking step 1 (E4).

