id: EXP-2026-08-017
slug: federation-isolation
title: Did merging require editing the source data, and did federation?
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-08-24
date_completed: 2026-08-23
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  C-015 is refuted -- federation does not beat merging on correctness -- which
  left the actual federation argument unclaimed. Merge cost and onboarding cost
  are ruled out as confounded by the choice of graphs. What remains and is
  measurable is structural: did the merged condition require editing the source
  data, and did the federated one? Supports the new C-022.

hypothesis: >
  The merged condition wrote a property onto a substantial fraction of one
  catalogue's nodes; the federated condition wrote none. Stated before counting:
  if federation also rewrites, the claim collapses and C-022 is not made.
  CONFIRMED: 1083 against 0.

