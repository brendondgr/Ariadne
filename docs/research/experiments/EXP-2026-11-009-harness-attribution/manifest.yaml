id: EXP-2026-11-009
slug: harness-attribution
title: "Era 2 Step 4: where the planned path loses an answer, and whether the model or the harness lost it (RQ5, Q57, Q58)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: 2026-11-15      # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Attributes every question a planner loses (authored plan retrieves records, planner retrieves none) to exactly one cause in pipeline order, for the deterministic planner (77, Q57) and the Gemma 4 26B LLM planner (105, EXP-2026-09-020 A-2), and splits each cause into the plan stage (the planner's own output; the model's decision for the LLM planner) or downstream (the harness lost a plan that was right). Also runs Q58's third arm (the authored plan under the planner's limits) back to back with its two controls, model-free and guarded at the socket, and records per-stage timing. Corrects the era-2 plan's reading of EXP-2026-09-019: its model swap was a narrator, not a planner.

hypothesis: >
  G1 one cause per lost question; G2 zero model-port connections in the reruns. E1 the downstream share of the LLM planner's losses is at least 0.25 (bands: >=0.50 mostly harness, 0.25-0.50 mixed, <0.25 mostly model); E2 plan-stage causes are the majority of the deterministic planner's 77; E3 the limits effect |composed - capped| <= 0.02; E4 today's reruns within 0.01 of the saved figures; E5 D5/D6 dominated by decomposition; E6 second annotator exact agreement >= 0.75, kappa >= 0.6. Informed by a disclosed pilot (PROTOCOL.md).

