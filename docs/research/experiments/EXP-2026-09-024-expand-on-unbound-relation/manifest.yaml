id: EXP-2026-09-024
slug: expand-on-unbound-relation
title: "Expanding the anchor's smallest facets when the question names no relation the card carries (plan Step 5)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-15
date_completed: 2026-09-15
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  54 of the 172 T1/T2 misses on the exposed bank bind the right anchor and no
  relation, because "defend against" and "rely on" are not words the card
  carries, and the shipped tree answers them with the anchor's one record.
  This tests a deterministic fallback: on the first re-plan, when no facet is
  question-relevant and the request is not definitional, expand the anchor's
  smallest non-zero facets (at most 4, none over 50 members). Bears on the
  plan's recall target and on whether catalogue dumps can be kept flat.

hypothesis: >
  Exposed bank, treatment (expand_unbound) vs control (anchor_first): T1 and
  T2 records_recall >= 0.75 (from 0.5060 / 0.4838); T1/T2 records_exact within
  +-0.02; catalogue_dump on every tier <= baseline + 0.02; wrong_entity
  unchanged. Sealed bank: T3 recall up, no tier's dump rate up by more than
  0.02. Falsifiers in PROTOCOL.md.

