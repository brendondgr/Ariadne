id: EXP-2026-08-012
slug: template-coverage-fix
title: Do the two template defects EXP-2026-08-010 found close, without moving a recorded number?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-08-21
date_completed: 2026-08-21
authors: ["brendondgr"]

purpose: >
  EXP-2026-08-010 found six of fourteen external question types below the
  ceiling and traced them to two defects in the Cypher template builder: a
  target label pinned to Technique when the anchor is a Group or Campaign, and
  no template at all for the Software-Group and Software-Campaign edges. This
  fixes both and re-measures on the same 182 questions, with the internal banks
  re-run byte-for-byte as the safety check. Bears on C-003 and C-012.

hypothesis: >
  Pre-registered in PROTOCOL.md section 3. (H1) The four families scoring 0.000
  reach their 1.000 ceiling. (H2) The two partial families come within 0.01 of
  theirs. (H3) Overall external recall rises from 0.6836 to at least 0.95.
  (H4) No internal answer changes -- the deterministic arm reproduces both
  committed banks exactly, clock readings excluded. H4 outweighs the rest: a
  coverage gain bought by moving a recorded number is not a gain. (H5) The
  plan-free arm gains less, since it must still infer the entity types the new
  dispatch branches key on.

