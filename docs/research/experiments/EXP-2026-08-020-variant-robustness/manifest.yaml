id: EXP-2026-08-020
slug: variant-robustness
title: "How much of the deterministic router's correctness survives paraphrase, and where does it break?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-08-29
date_completed: 2026-08-31       # was 2026-08-29 (Arm 0 only); Arms 4-6 and Step 6 ran 2026-08-30 23:57 - 2026-08-31 11:39 and the last artifact (scored_arm6.json) was committed at 9f02dc6 on 2026-08-31 (A-1)
authors: ["brendondgr"]

purpose: >
  The router matches a question's words against each source's declared node
  labels and relationship types, exactly, with a trailing "s" as its entire
  morphology. This measures what that costs on paraphrases of the 120 golden
  questions, tiered from "identifier kept, verb swapped" down to "described
  without its identifier, its name, or any schema word". Bears on C-001 (a
  robustness limit on the deterministic path), C-010 (whether the vocabulary
  machinery is schema-agnostic), C-021 (the first questions here NOT written in
  the schema's own vocabulary) and Q4 (open-ended questions, unmeasured since
  the project began).

hypothesis: >
  H1 record identity falls monotonically T1 to T5, with the identifier-bearing
  tiers losing less. H2 the dominant failure is silent downgrade to the generic
  describe primitive rather than abstention -- a confident answer about the
  right entity carrying the wrong information, which passes every internal
  check. H3 negative-control questions about nonexistent entities return
  nothing. See PROTOCOL.md.

