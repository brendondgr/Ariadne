id: EXP-2026-09-023
slug: anchor-hygiene-and-q59
title: "Exact names that are lookups, and looking them up before choosing a dataset (plan Steps 2-4)"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-09-15
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  Two deterministic, card-driven changes to anchor binding. H1: a single-token
  exact name whose token appears in more than 1% of the corpus's own documents
  is an ordinary word, not a lookup; applied to exact_name_matches it should
  remove the T4/T5/T6 wrong binds (27 of 54 are one node named "Credentials")
  without losing T3's gold binds. H2 (Q59): looking an exact name up across every
  live source before dataset selection, with the router as tie-break, should
  recover the T3 questions that reach no anchor today. Step 0 enters the
  2026-09-15 review probes (shipped index vs EXP-2026-09-022's prototype; the
  exact-name distribution) into the record. Bears on C-023 and Q59.

hypothesis: >
  H1 on the sealed bank: T3 gold-bind loss <= 2%, T4/T5 single wrong binds
  reduced >= 60%, T6 binds <= 2 of 40; the 1% threshold is fixed, not moved.
  H2 on the exposed bank: T3 skipped_unresolved_anchor 37 -> <= 15, T3
  records_exact 0.3267 -> >= 0.45, T1/T2 unchanged, T6 wrong_entity <= 0.0667,
  T4/T5 wrong_entity at or below D-035; on the sealed bank T3 records_exact
  >= +0.10 over the sealed baseline. Falsifiers in PROTOCOL.md.

