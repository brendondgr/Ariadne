id: EXP-2026-09-005
slug: post-repair-arm-comparison
title: Does the generic-over-deterministic gap survive repairing the deterministic arm's retrieval defects?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-09-03
date_completed: "2026-09-03"
authors: ["brendondgr"]

purpose: >
  EXP-2026-09-002 measured generic 0.6576 against deterministic 0.4934 while the
  deterministic arm carried three retrieval defects, so the 0.1642 gap was not
  quotable: a reviewer could say the baseline was broken. This re-measures both
  arms after all three repairs. It is the experiment C-023 depends on.

hypothesis: >
  Stated in the repair plan (21f5384) as an exit criterion that does not presume
  a direction: "the gap is re-measured", not "the gap survives". It survives, at
  0.1623 against 0.1642.

