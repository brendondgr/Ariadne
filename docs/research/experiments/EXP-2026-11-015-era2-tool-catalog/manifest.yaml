id: EXP-2026-11-015
slug: era2-tool-catalog
title: "Era 2 Step 8: a tool catalog generated from the card, and a typed hand-off to the specialists"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-18
date_completed: 2026-11-18
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 8 of the era-2 plan v2. Generates a typed tool catalog (JSON Schema enums, option rules, plain relation readings, coercion, teaching errors) from any source card with no per-graph code, and moves every English read out of the specialists. Tests whether a Qwen 3.8 planner emitting typed plans through the catalog meets the four operator-agreed bars against today's English hand-off on one tree. Engineering measurement for the era-2 agent; no paper claim yet.

hypothesis: >
  G1 T1 synonym-tier records_exact >= 0.80; G2 dev-bank empty retrievals at most half of the English control's same-tree count (amendment 1; was <= 38); G3 T0 original-wording records_exact >= 0.98; G4 confidently-wrong counts not above the English control. Judged on T-lazy (Qwen 3.8, names-only card, find_schema/describe) against arm E.

