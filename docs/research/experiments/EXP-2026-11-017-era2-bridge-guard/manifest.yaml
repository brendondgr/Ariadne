id: EXP-2026-11-017
slug: era2-bridge-guard
title: "Era 2 Step 8 follow-up 2: the bridge-route scan guard in the typed planner, re-run on EXP-2026-11-015's arms and gates"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-19
date_completed: 2026-11-19
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Follow-up to EXP-2026-11-016, whose F1 check missed by one answer (F-REV-06 T5: an ATT&CK technique found, its CAPEC link refused, the repair listed every CAPEC taxonomy entry). Five changes to the typed planner's refusals and scan guard close the bridge route; they were proven on the previously failing items and on the legitimate scan questions before this run (PROTOCOL, Smoke). Same banks, arms, settings and gates. Engineering measurement; no paper claim.

hypothesis: >
  F1: no T-lazy confidently-wrong answer is an anchorless scan (variants T0-T5 and dev). H1 (harness): no arm has more than 12 model-less answers. Predicted: variants confidently wrong T-lazy about 47 against E's about 36 (G4 variants part fails); dev part passes; G1-G3 verdicts unchanged from EXP-2026-11-016.

