id: EXP-2026-11-005
slug: typed-v2-second-benchmark
title: "Typed request format v2 on CypherBench, and every T1 arm on a second benchmark (Text2Cypher)"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-11-14
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Part A: does format v2 fix EXP-2026-11-004's union failures without cost? Part B: on Text2Cypher questions (free-form gold, not the templates the format was designed from), do typed requests still beat free Gremlin, stay near free Cypher, and score identically on both backends?

hypothesis: >
  Part B, per model, 3-shot: typed2-via-Gremlin >= free Gremlin + 0.10 (H2); typed2-via-Cypher >= free Cypher - 0.05 (H3); backends within 0.02 (H1). Kill if H2 fails for any model or H3 fails for every model. Part A expectations in PROTOCOL.md.

