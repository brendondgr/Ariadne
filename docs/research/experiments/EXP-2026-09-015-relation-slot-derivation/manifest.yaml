id: EXP-2026-09-015
slug: relation-slot-derivation
title: "Can the relation slot be derived from the label pair instead of asked of the model?"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-09-09
date_completed: null       # null until status is complete/failed
authors: ["claude"]

purpose: >
  EXP-2026-09-014 measured the rewrite stage per slot and found relation the
  worst at every tier, with 31 of its 85 refusals caused by the model naming a
  list position that did not exist. The canonical schema pins the relation for
  16 of CAPEC's 17 declared label pairs and all 19 of ATT&CK's, so this asks
  whether the slot needs a model at all. Bears on Q35 and on any future attempt
  to ship the rewrite stage; carries no claim of its own.

hypothesis: >
  Deriving the relation from the (anchor label, target label) pair raises
  slot_relation at T3, T4 and T5, raises form_exact at two of the three, and
  does not raise wrong_entity at any tier. Pre-registered in PROTOCOL.md before
  the first run, together with the falsifier: if slot_relation rises and
  form_exact does not, the relation slot was not the binding constraint.

