id: EXP-2026-11-006
slug: typed-v3-three-benchmarks
title: "Typed request format v3 on CypherBench, Text2Cypher (development) and Mind the Query (held out)"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-11-14
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Format v3 adds the operators EXP-2026-11-005 found missing (ranking by an aggregate, per-group aggregates, numbers stored as text, list size, property comparisons, negation, edge references in optional). Part A checks it does not regress on CypherBench and puts Qwen at reasoning_effort=medium throughout; part B checks the fixes on Text2Cypher (development data); part C tests on Mind the Query, which the format was never shaped by, whether typed requests beat free Gremlin, stay near free Cypher and agree across backends (RQ1).

hypothesis: >
  Part C, per model, 3-shot: typed3-via-Gremlin >= free Gremlin + 0.10 (H2); typed3-via-Cypher >= free Cypher - 0.05 (H3); backends within 0.02 (H1). Kill if H2 fails for any model or H3 fails for every model. Part B: typed3 >= typed2 + 0.10 (B1, development). Part A: typed3 >= typed2 - 0.02 (A1).

