id: EXP-2026-11-004
slug: t1-typed-arm
title: "Typed requests compiled to Cypher and Gremlin vs free query writing on CypherBench graphs (T1 typed arm)"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-11-14
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  The typed arm of kill test T1. A model fills in a typed request, which code compiles to Cypher and to Gremlin; exact-records on the same 200 CypherBench questions is compared with the same models writing each language themselves (EXP-2026-11-003).

hypothesis: >
  Per model, 3-shot: typed-via-Gremlin is at least 0.10 above free Gremlin (H2); typed-via-Cypher is no more than 0.05 below free Cypher (H3); the two backends differ by at most 0.02 (H1). Kill rule in PROTOCOL.md.

