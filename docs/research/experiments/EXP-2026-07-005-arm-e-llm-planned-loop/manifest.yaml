authors: [brendondgr]

purpose: >
  One cell of the controlled seven-arm study isolating deterministic from
  LLM-based query planning over the 120-question golden catalogue, with
  extraction and synthesis varied independently. Plan: LLM planner. Extract:
  deterministic + facet-chasing loop. Synthesize: LLM over verified claims. This arm is the evidence for the study's
  central finding that accuracy lives in the hand-written templates and that
  LLM planning is the dominant single regression.

hypothesis: >
  exploratory — no prior hypothesis was registered for this arm. The study was
  designed as a factorial comparison rather than a test of a stated prediction,
  and this manifest does not invent one retrospectively.

