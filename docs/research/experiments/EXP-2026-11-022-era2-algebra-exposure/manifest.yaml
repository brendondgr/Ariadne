id: EXP-2026-11-022
slug: era2-algebra-exposure
title: "Era 2 Step 9 Phases G-H: does showing the operator algebra to the typed planner help on questions that need it, without harm on today's?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-11-20
date_completed: 2026-11-23
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 9's exposure gate. Show the operator algebra to the typed planner behind two switches (ARIADNE_ALGEBRA_CORE, ARIADNE_ALGEBRA_EXTENDED) and ask whether it answers the probe questions that need the operators, and whether it keeps answering today's variant and dev questions as well as with the switches off. Decides whether either switch is on by default; no paper claim moves until Q65 is answered.

hypothesis: >
  Stated in PROTOCOL before any model ran with the operators visible: core reaches >= 0.5 exact on the core probe items (Qwen) where off reaches near zero, and today's banks stay within noise of off. Outcome: the probe prediction held (0.82-0.91 on all three arms); the no-harm prediction did not hold for Gemma (stop rule on both core sittings; two capped fix rounds failed their proving bars), so both switches stay off.

