id: EXP-2026-11-002
slug: t3-synthetic-calibration
title: "Label-free calibration: conformal thresholds set on card-generated questions, applied to real ones (kill test T3)"
status: planned            # planned | running | complete | failed | superseded
date_started: 2026-11-13
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Kill test T3. Measures whether a conformal entity-grounding threshold calibrated only on card-generated questions holds its miscoverage target on real questions, with and without vocabulary-distance stratification, against OnlyReal-30 and SPI-30.

hypothesis: >
  Distance-stratified zero-label miscoverage <= 0.12 at alpha = 0.10 and closer to alpha than unweighted. Kill rule in PROTOCOL.md.

