id: EXP-2026-08-009
slug: merged-graph-counterfactual
title: Does federating across two engines beat merging both sources into one graph?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-08-21
date_completed: 2026-08-21 # null until status is complete/failed
authors: ["brendondgr"]

purpose: >
  C-015 says federating across two engines outperforms merging both sources into
  one graph. It has been `unsupported` since the record was established because
  the merged baseline had never been built. It exists now — one Neo4j holding
  both catalogues, answered by one Cypher specialist running the schema-driven
  primitives — and this measures it against the federated arm that runs the same
  primitives, on the same questions, graded by the same grader in one session.

hypothesis: >
  Stated before the run. (1) On correctness the two will not separate: the merged
  arm runs the same primitives over the same plans, and a single store removes a
  hop without adding information, so a difference inside the grader's own 0.0050
  spread is expected. (2) The merged arm will complete more cross-source chains,
  because in one store the consumer sub-question's seeds are reachable without
  leaving the engine. If (1) holds, C-015 as written is not supported by
  correctness and the federation argument must rest on something else.

