id: EXP-2026-11-007
slug: era2-reply-repair-replay
title: "Era 2 Step 2: the reply-repair layer replayed over every saved kill-test reply, plus the live model matrix"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 2 of the era-2 plan builds one tool-call format for every model, logged reply repairs, a model registry with a token-id identity check, and a matrix runner. This experiment checks the repair layer against the 15,748 replies the typed kill tests (EXP-2026-11-004 to -006) saved: what it recovers, whether it ever changes a reply the old parser read, whether any repair is silent, and whether a recovered reply could change a kill verdict. It also records the live matrix run and the live swap refusal that validate the registry.

hypothesis: >
  Gates: zero silent repairs (H1) and zero changed readings against the kill tests' parser (H2). Expectations: Gemma's capped part-C replies stay invalid (E1); at most 2% of typed replies rescued per cache (E2); no kill verdict can change (E3). See PROTOCOL.md.

