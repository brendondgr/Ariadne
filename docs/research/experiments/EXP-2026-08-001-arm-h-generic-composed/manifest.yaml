id: EXP-2026-08-001
slug: arm-h-generic-composed
title: Is Arm G's gap a capability gap in the schema-driven layer, or domain knowledge?
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-08-09
date_completed: 2026-08-09
authors: [brendondgr]

purpose: >
  Arm G (EXP-2026-07-007) priced the loss of every hand-written template at
  -0.3568 correctness, which CLAIMS.md C-003 reads as "accuracy lives in the
  templates". This asks whether that gap is domain knowledge or a capability
  gap in the schema-driven layer, by adding three capabilities derivable from
  declarations the repository already holds - cross-source join projection,
  composition (multi-hop chaining and two-anchor intersection), and
  anchor/direction resolution - and re-measuring retrieval on the same 120
  questions. It qualifies C-003 rather than supporting or refuting it: the
  retrieval component of the gap closes completely, and what remains
  template-shaped is precision.

hypothesis: >
  The gap is capability, not knowledge: seed_lost falls to 0, retrieval_empty to
  at most 2, incomplete_retrieval to at most 5, gold_in_evidence rises to at
  least 0.97, and no question's gold-in-evidence decreases. Recorded before the
  full run but after spot checks over 30 of the 120 questions, so not a clean
  pre-registration - see ISSUES.md.

