id: EXP-2026-09-003
slug: capec-anchor-resolution
title: Does binding CAPEC anchors by identity rather than a guessed label recover the View and Category questions?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-09-03
date_completed: "2026-09-03"
authors: ["brendondgr"]

purpose: >
  EXP-2026-09-002 reported 68 containment questions and 2 View property reads
  failing with an empty query, and the repair plan attributed them to a
  hardcoded hasLabel("AttackPattern") on the Gremlin anchors. This measures what
  fixing that actually recovers. It bears on C-012 and C-023 only indirectly:
  its purpose is to size a defect in the deterministic arm before the arms are
  re-compared, so that the comparison is not made against a known-broken
  baseline.

hypothesis: >
  Stated in docs/plans/2026-09-03-capec-anchor-resolution.md before the run:
  47 cases move (2 View property reads, 33 describe containment, 7
  capec_neighbors, 5 capec_maps_to), and 15 named cases do not — 9 already
  anchored correctly on AttackPattern and 6 capec_maps_to cases anchored on
  Technique, which is a routing defect rather than a label one.
  **The first half was wrong and the second half was right.**

