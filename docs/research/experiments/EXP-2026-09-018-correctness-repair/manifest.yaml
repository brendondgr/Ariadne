statistical_test: >
  Paired per question with both counterbalanced grading positions averaged before
  differencing, so a question graded once does not count as one graded twice.
  Separability by |difference| > 2*SE. Single-tier differences below ~0.06 are
  inside grader noise at these tier sizes (Step 5) and are not claimed.

