id: EXP-2026-09-018
slug: correctness-repair
title: "Correctness repair: six located defects, measured against a concurrent control"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-11
date_completed: 2026-09-14 # null until status is complete/failed
authors:
- Claude Opus 5
- brendondgr

purpose: >
  The generic arm scores 0.6569 on the 284 development questions and 0.9675 on
  the 67 where none of six located defects fires (EXP-2026-09-017 A-2). This
  experiment repairs those six defects and measures whether the judged mean
  moves, against a concurrent reference-commit control, a grader-drift control
  and a freshly sealed evaluation set. It amends the evidence for C-023 and
  extends C-017 with a verified absence claim; it does not replace either.

hypothesis: >
  Each defect is a coding error with an identified location rather than a
  capability limit, so repairing it raises the judged mean on the questions it
  owns and leaves the others alone. Six hypotheses H1-H6 with pre-registered
  thresholds and a kill gate are in PROTOCOL.md, written before any repair.

