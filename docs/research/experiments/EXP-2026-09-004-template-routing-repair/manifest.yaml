id: EXP-2026-09-004
slug: template-routing-repair
title: Does gating the template ladder on what a question asks, rather than which labels it names, recover the property reads and containment questions?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-09-03
date_completed: "2026-09-03"
authors: ["brendondgr"]

purpose: >
  EXP-2026-09-002 recorded Group and Tactic property reads at exactly 0.0000 and
  68 containment questions failing; EXP-2026-09-003 showed the CAPEC half was a
  routing defect hiding behind an anchor defect. This measures what gating the
  ladder on the question's shape recovers, so the deterministic arm is not
  re-compared against a baseline carrying a known routing bug. Bears on C-012
  and C-023 only through that.

hypothesis: >
  Recorded in PROTOCOL.md and committed at 1a6c22b before the run: 23 of 32 move
  and 9 do not, with the reverse-direction cases predicted to be *correct* and to
  move nothing because view membership is sparse. The "will not move" half was
  exactly right (9/9); the "will move" half was over-optimistic (14/23).

