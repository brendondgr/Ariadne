id: EXP-2026-08-004
slug: bridge-outer-join
title: Does making the cross-source bridge an outer join close the residual blind-set gap without regressing?
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-08-10
date_completed: 2026-08-10
authors: [brendondgr]

purpose: >
  EXP-2026-08-003 left five gold identifiers unretrieved on the blind holdout and
  traced all five to one defect: the generic cross-source bridge was an inner
  join, so a CAPEC pattern with no ATT&CK mapping was dropped from the evidence
  entirely. This makes the bridge an outer join and re-measures both question
  sets. It also decomposes the 45% of blind loss that survives complete
  retrieval, which no query-construction work can reach.

hypothesis: >
  The outer join recovers all five residual identifiers with no regression on
  either set, and the surviving blind loss resolves to a small number of named
  composition defects rather than being diffuse. Falsified by any regression, or
  by the residual loss having no dominant named class.

