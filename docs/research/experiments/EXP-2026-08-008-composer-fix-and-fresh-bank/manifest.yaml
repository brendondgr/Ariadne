id: EXP-2026-08-008
slug: composer-fix-and-fresh-bank
title: Do the answer-writing fixes help, how do four arms compare on unseen questions, and does an LLM writing its own queries beat templates?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-08-19
date_completed: 2026-08-19  # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  Four things were built on 2026-08-19 with no number attached: two fixes to how
  answers are written, a generator for fresh question sets, an arm where a model
  writes the query itself, and an isolated store for the merged-graph
  counterfactual. This measures the first three. It settles C-012 — the paper's
  intended headline, previously supported by nothing — and it materially
  corrects C-021, recorded earlier the same day.

hypothesis: >
  For the composer fixes, stated before the run: the three questions judged 0.5
  for answering with the wrong field will move, and the aggregate will move less
  because few questions are affected. The first half held and the second did
  not — the aggregate moved +0.098. The arm comparison and the failure split
  were exploratory.

