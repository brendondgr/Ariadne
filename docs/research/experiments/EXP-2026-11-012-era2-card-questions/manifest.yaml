id: EXP-2026-11-012
slug: era2-card-questions
title: "Era 2 Step 6: questions with gold answers generated from the ATT&CK and CAPEC cards alone"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-16
date_completed: 2026-11-16
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 6 generates evaluation questions from a source card alone: slots from the card's schema, anchors from the graph, gold by executing each question's own typed request (Step 5's exact fetch), six rewording tiers (identifier, name, reworded name, description, synonym relation, paraphrased schema) written by Qwen 3.8 27B with automatic leak checks, and three new kinds (ambiguous with a gold clarification, out of coverage, insufficient), split into sealed tuning and held-out banks per decision step with no shared anchor.

hypothesis: >
  Gates: every question's gold re-executes identically (G1); tuning and held-out share no anchor (G2); 0 leaks in the synonym and paraphrased-schema tiers (G3); fixture tests pass (G4). Expectations: yield above 0.8 outside the synonym tier (E1); reader fluency at least 0.9 on identifier and name tiers, 70-90% of ambiguous questions truly ambiguous (E2; a person's read pending, a blind proxy recorded); about 450 ATT&CK and 220 CAPEC questions (E3).

