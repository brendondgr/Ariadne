  estimated_cost_usd: 0.0

# --- LLM / agentic block (delete entirely if no model was in the loop) ---
llm:
  model: "relay/qwen38-27b@2026-11-16 (alias default-model, reasoning_effort=medium, temperature 0.7) as the first question writer, proxy reader claude-sonnet-5-5; second writer claude-sonnet-5-5 (medium effort, 20 Claude Code subagents, the scored banks), proxy reader claude-opus-5-5 (medium effort)"
  temperature: 0.7
  top_p: 1.0
  max_tokens: 2048
  prompt_files: []
  prompt_hash: null
  tool_schema_hash: null
  total_input_tokens: null
  total_output_tokens: null
  nondeterminism_note: >
    Provider-side nondeterminism remains even at temperature 0; results
    are reported as mean ± std over n_runs.

