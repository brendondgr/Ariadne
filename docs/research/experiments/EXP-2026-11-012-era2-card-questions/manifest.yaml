  entrypoint: "uv run python scripts/era2_card_bank.py --out docs/research/experiments/EXP-2026-11-012-era2-card-questions/data --banks docs/evaluation/banks; then scripts/era2_card_reword.py export|check|assemble|metrics (second writer, amendments 5-7)"
