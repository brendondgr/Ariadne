id: EXP-2026-11-019
slug: era2-written-id-guard
title: "Era 2 Step 8 follow-up 4: a written id outranks a name match, proven on the 16 recorded failures with controls"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-20
date_completed: 2026-11-20
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Follow-up to EXP-2026-11-018 (RESULTS 6-7). When the question writes an id and the typed plan anchors by name, the name lookup can return another entity: a shared name (DET0891 and DET0862), the id given as the name (CAPEC-600 resolved to CAPEC-16), or a name the question pairs with an id the graph lacks. 16 recorded typed answers fail this way. A guard in the typed planner takes the written id when it is tied to the name. Proven on those items with controls; no full-bank run (its full effect is counted in Step 9's run). Engineering measurement; no paper claim.

hypothesis: >
  S1: the guard fires on no control, and no control loses because of it. S2: every target where it fires anchors the written id and is not confidently wrong. H1: model-less answers 0 or 1 per subset. Predicted: it fires on most Gemma targets and few Qwen ones; fired targets become exact; controls unchanged.

