id: EXP-2026-08-019
slug: llm-determinism-levers
title: Does seeding or concurrency change LLM-arm variance, and what does raising workers actually cost?
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-08-24
date_completed: 2026-08-24
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  Q2's surviving half. The deterministic arms carry an interval; the LLM arms are
  all n=1. The operator asked to minimise the variance rather than merely measure
  it, and asked directly whether the available 32-way concurrency is safe. This
  measures the two levers under client control -- a pinned seed, and worker count
  -- rather than assuming either.

hypothesis: >
  H1 seeding reduces spread at fixed concurrency -- REFUTED (gold sd 0.0212 seeded
  against 0.0207 unseeded). H2 concurrency 1 is most reproducible -- UNFALSIFIED,
  condition C deferred on cost. H3 32 workers is less reproducible than 16 --
  REFUTED on the stated metric but the real cost is elsewhere: latency +61%,
  timeouts doubled, and measured quality INFLATED because a timeout falls back to
  the stronger deterministic composer (r = +0.62 fallbacks vs gold).

