id: EXP-2026-09-028
slug: disclosed-anchor-acceptance
title: "A described entity resolved from a reranked closed choice, disclosed on the answer's first line (plan Step 9)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-15
date_completed: 2026-09-16
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  T4/T5 answer nothing under D-035 because the model's anchor choice was
  refused after D-034 measured it wrong a third of the time. This reranks
  the name index's top 25 by embedding similarity (bge-small, standing down
  on exact names), lets the closed choice pick from the top 5 with its own
  "none of these", and writes the resolution into the answer's first line.
  Bears on the T4/T5 recall target and on what an analyst who does not know
  the name should be shown.

hypothesis: >
  H1 sealed: T4 and T5 records_exact >= 0.30 with wrong_entity <= 0.15, T6
  wrong_entity <= 0.10, T3 within +-0.02 of form_execute. Falsifiers in
  PROTOCOL.md; a failure ships the rung as a clarification, not an answer.

