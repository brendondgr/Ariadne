id: EXP-2026-09-025
slug: direct-form-execution
title: "Executing the bound form as a plan instead of re-parsing its rendering, and lifting the identifier skip on top (plan Step 6)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-15
date_completed: 2026-09-15
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  The rewrite stage renders its bound form to English and the drafter parses
  it again; the round trip broke 13 T1 answers in EXP-2026-09-021 and three
  sealed T3 answers in EXP-2026-09-023. This executes the form directly (H1)
  and, on top, lifts the D-034 identifier skip so id-bearing questions get
  their relation filled with the anchor held fixed (H2). Bears on the plan's
  T1/T2 exact target and on portability: a form is graph-agnostic.

hypothesis: >
  H1 exposed: T3 records_exact +>= 0.05 over anchor_first with wrong_entity
  and catalogue_dump unchanged and T1/T2 byte-identical; sealed: the three
  rendering-broken T3 answers recovered. H2 exposed: T1/T2 records_exact not
  below control - 0.02 and records_recall +>= 0.05 with wrong_entity
  unchanged. Falsifiers in PROTOCOL.md.

