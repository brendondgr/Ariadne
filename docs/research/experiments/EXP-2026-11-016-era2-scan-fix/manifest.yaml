id: EXP-2026-11-016
slug: era2-scan-fix
title: "Era 2 Step 8 follow-up: the anchorless-scan fix in the typed planner, re-run on EXP-2026-11-015's arms and gates"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-11-19
date_completed: 2026-11-19
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Follow-up to EXP-2026-11-015 at the operator's request. The typed planner replaced unresolvable anchors with whole-label scans (11 of 12 dev confidently-wrong answers). The fix (prompt wording, a not-found answer from resolve_entity, no scan hint in refusals, and a scan guard when the question names an id) is measured on the same banks, arms and gates. Engineering measurement; no paper claim.

hypothesis: >
  F1: no T-lazy confidently-wrong answer is an anchorless scan (variants T0-T5 and dev). Predicted, from EXP-2026-11-015's counts: dev confidently wrong about 1 (G4 dev part passes), variants about 45 against E's 33 (G4 variants part fails); G1-G3 verdicts unchanged; the T4/T5 gain over E holds.

