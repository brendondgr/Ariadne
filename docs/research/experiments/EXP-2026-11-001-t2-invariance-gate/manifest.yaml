id: EXP-2026-11-001
slug: t2-invariance-gate
title: "Answer-invariance gate: run every plausible interpretation, answer only when they agree (kill test T2)"
status: planned            # planned | running | complete | failed | superseded
date_started: 2026-11-13
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Kill test T2. Measures whether executing every card-valid interpretation and answering only on agreement asks too often or prunes the meant reading, against a single-guess baseline.

hypothesis: >
  T2-filtered ask_rate <= 0.40 and gold_pruned_rate < 0.30 on the confirmation bank; fewer confident-wrong answers than the guess baseline. Kill rule in PROTOCOL.md.

