id: EXP-2026-09-026
slug: generic-engine-parity
title: "Generic-engine parity on the named defects: the cross-source bridge chosen by seed origin, not vocabulary (plan Step 7)"
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-15
date_completed: 2026-09-15
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  The schema-derived engine loses to the template cascade by 0.175 at T1 on
  the exposed bank (EXP-2026-09-021 Step 3). Tracing the paired losses found
  one dispatch defect behind most categories: the generic Gremlin path takes
  the cross-source bridge only on mapping vocabulary, so a reverse-mapped seed
  is rejected and a paraphrased mapping question starves its consumer. This
  fixes the dispatch and measures parity. Bears on retiring the templates,
  which is what makes a new graph answerable on its card alone.

hypothesis: >
  H1: generic within -0.02 of templates on exposed T1/T2/T3 records_exact,
  no category where templates win by more than two paired cases, wrong_entity
  and catalogue_dump not above the cascade's; sealed T3 within -0.02. The
  CWE chain (5 exposed cases) is not predicted to close. Falsifiers in
  PROTOCOL.md.

