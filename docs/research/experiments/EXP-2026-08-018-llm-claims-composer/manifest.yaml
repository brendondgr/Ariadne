id: EXP-2026-08-018
slug: llm-claims-composer
title: Reconnect the unreachable LLM claims composer and measure it — do the verifier gates fire when a model proposes claims?
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-08-24
date_completed: 2026-08-24
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  Q20. OpenAICompatibleComposer is the only thing that lets a language model
  propose a claim, and factory.synthesize never called select_composer, so it had
  no caller -- which is why EXP-2026-08-014 could only report that all four
  verifier gates cut zero claims from 888. A gate cannot cut what cannot be
  constructed. Reconnected behind its own flag and measured over five tests
  before any decision to delete.

hypothesis: >
  Pre-registered decision rule rather than a point hypothesis (PROTOCOL 5):
  delete if the composer cannot run reliably or the gates never fire; keep if the
  gates fire; keep-but-never-default if they fire and grounding or cost is
  materially worse. SELECTED: the third. Gates fired 32-36 times per run against
  zero deterministic, grounding is 0.137 worse and cost is 67x.

