  # preflight.narrator), never the alias (D-028).
  model: "relay/qwen38-27B-v2@2026-09-06"
  temperature: 0.0
  top_p: 1.0
  max_tokens: 16384        # the narrator's output budget, read from the context-overflow message in PROTOCOL A-3 ("requested 16384 output tokens")
  prompt_files: []
  prompt_hash: null
  tool_schema_hash: null
  total_input_tokens: null
  total_output_tokens: null
  nondeterminism_note: >
    This experiment measures nondeterminism rather than averaging over it: two
    captures per arm, compared exactly. deterministic is content-identical;
    generic differs on answer.narrative in 143 of 276 compared answers at the
    same seed. 8 of 284 generic answers were excluded for transient narrator
    failures (5 per capture) and one deterministic context-overflow case was
    kept because it is identical in both captures (PROTOCOL A-3).

