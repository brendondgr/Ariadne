id: EXP-2026-09-010
slug: model-free-arm-identity
title: "Do the model-free arms actually repeat across runs?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-09-06
date_completed: 2026-09-07 # second guarded generic capture finished 2026-09-07 00:00:05 (generic-rerun-state.json); completion commit e76eab1 00:03 (A-1)
authors: [brendondgr]      # git author of 9e79114, 0f2d81b, 1bcf3bb, 62d7097 and e76eab1

purpose: >
  Do the arms the paper runs once — deterministic and generic — actually repeat
  across runs? Thirty-six of forty-two experiments were n_runs 1, justified by
  asserting those arms are model-free on the query path and therefore
  deterministic; that assumption had never been measured and is what lets
  C-023's single-draw figures be published. Each arm is run twice, back to
  back, on the expansion-bank dev half (n=284) and the two captures are
  compared field by field. Outcome: deterministic is content-identical
  (284/284 after two clock keys); generic is NOT model-free — it narrates with
  a language model (run_meta.synthesis "llm (claim-grounded)") and re-words
  143 of 276 answers on a same-seed rerun — which made EXP-2026-09-011's
  variance measurement necessary. Written retrospectively on 2026-09-09 from
  PROTOCOL.md (A-1).

hypothesis: >
  Pre-registered in PROTOCOL.md on 2026-09-06 before any run. H1 deterministic
  is byte-identical across the two runs modulo timing_ms. H2 generic is
  byte-identical. H3 any difference is confined to key paths that carry no
  scored content. Outcome: H1 as literally worded fails (2/284 under the
  pre-registered exclusion; run_meta.wall_s is a second clock key) and holds in
  intent (284/284 content-identical); H2 fails (133/276 identical); H3 fails
  (answer.narrative is the field the grader reads). Amendments A-1..A-3 in
  PROTOCOL.md record what the run found along the way.

