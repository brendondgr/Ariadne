id: EXP-2026-11-021
slug: era2-algebra-engine-check
title: "Era 2 Step 9 Phases E-F: do the Cypher and Gremlin compilers of the operator algebra mean the same thing, and did the move change any answer?"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-11-20
date_completed: 2026-11-20
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 9's engine gate. Run every operator of the algebra, compiled to Cypher and to Gremlin, on ATT&CK and CAPEC loaded into both engines of a separate verification pair, and require zero disagreements; check each semantic rule against hand-computed answers; check the new compilers return today's answers on recorded steps; and prove, model-free and tree to tree, that moving today's typed-step compilation changed no answer (Phase F). Engineering; no paper claim.

hypothesis: >
  H1 every semantic rule test passes on both backends. H2 zero Cypher/Gremlin disagreements beyond relative 1e-9 (predicted: defects in untested Gremlin idioms found and fixed first). H3 the new compilers equal today's builder on today's shapes. H4 the typed replay, R capture and deterministic answers are identical tree to tree.

