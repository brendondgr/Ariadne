id: EXP-2026-08-003
slug: arm-h-blind-holdout
title: Do the schema-driven primitives generalise to questions nobody wrote templates for?
status: superseded         # set 2026-09-09 (RESULTS A-2): EXP-2026-08-004 replaced the 0.8952 headline on the same arm and bank with 1.0000 the same day
date_started: 2026-08-10
date_completed: 2026-08-10
authors: [brendondgr]

purpose: >
  EXP-2026-08-002 found the deterministic pipeline's largest blind-set failure to
  be structural - the hand-written templates serve only the relation direction the
  development bank happened to ask, so the groups category scored 0.00. Arm H
  (EXP-2026-08-001) replaced the cascade with primitives that resolve direction
  from the declared facet. This runs Arm H against the same 30 blind questions to
  ask whether that generalises. It qualifies C-003 and partly closes C-014's
  measured cliff: retrieval rises 0.7688 to 0.8952, concentrated entirely in the
  two diagnosed categories, while roughly half the blind deficit turns out not to
  be a retrieval problem at all.

hypothesis: >
  Arm H's retrieval beats the template cascade's on the blind set, with the gain
  concentrated in the reverse-direction categories (H-GRP, H-SW) rather than
  spread evenly, and no category regressing. Falsified by a diffuse gain, which
  would suggest a metric artifact rather than the diagnosed defect.

