id: EXP-2026-11-011
slug: era2-exact-answers
title: "Era 2 Step 5: exact answers, result handles, and nothing cut silently"
status: running            # planned | running | complete | failed | superseded
date_started: 2026-11-16
date_completed: null       # null until status is complete/failed
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 5 makes every result exact and every cut explicit: connectors and the scaffold detect a result cut at its row ceiling (partial, with a ceiling trace), the composer never writes All N for a cut list, the agent layer fetches full sets with exact totals in Neo4j and Gremlin (stream or keyset), keeps them as set handles in the run log with set operations, and shows the agent a lossless view with an empty-result diagnosis; the fast-path envelope carries the full sets. This records the gates and the hub, regression and ceiling measurements.

hypothesis: >
  Gates: zero silent truncations (G1); paged equals unpaged and totals equal the database count on the fixture graphs, both backends identical (G2); set_op intersect equals the database-side intersection (G3); every enumeration claim's N equals what it lists plus what it withholds, with no ceiling hit, on 284 dev answers (G4). Expectations: 10^5 and 10^6 hubs exact within the 5 s card timeout at p95 (E1); regression answers unchanged (E2); 0 of 284 dev questions hit the 20,000-row ceiling (E3).

