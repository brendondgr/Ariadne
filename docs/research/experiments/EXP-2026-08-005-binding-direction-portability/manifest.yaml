id: EXP-2026-08-005
slug: binding-direction-portability
title: Is the blind holdout's directional loss a property of these templates, or of a missing schema-driven check?
status: superseded        # set 2026-09-09 (RESULTS A-2): EXP-2026-08-006, 34 minutes later, replaced the 0.8952 blind headline on the same arm and bank with 1.0000
date_started: 2026-08-18
date_completed: 2026-08-18
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  EXP-2026-08-002 lost four blind questions to queries that filter a property
  against values it can never hold — Group.attack_id against a technique id —
  and EXP-2026-08-003 showed the schema-driven branch does not have the defect.
  This asks whether the default cascade can be given the same property without
  re-authoring MITRE knowledge: identifier schemes learned from the canonical
  snapshot, a three-valued binding check in the pre-run gate, and edge direction
  resolved from the declared triples. It bears on C-001 (the cascade's
  correctness claim), C-003 and C-014 (what the measured cliff is a property
  of), and on C-010, since the mechanism is the portability path.

hypothesis: >
  Stated in docs/plans/binding-and-direction-portability.md before any code
  changed: the repair is additive — it reaches only task shapes that previously
  emitted a structurally unsatisfiable query — so the 120-question development
  catalogue moves by exactly nothing while the blind set improves.

