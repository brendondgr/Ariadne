id: EXP-2026-08-014
slug: verifier-ablation
title: Does the verifier actually cut anything? Each of the four claim gates, ablated
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-08-24
date_completed: 2026-08-23
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  Q10. C-017 claims claim-level verification "eliminates unsupported claims",
  evidenced only by provenance and inspectability reading 1.0 -- self-consistency
  checks that say the verifier ran, not that it caught anything. This disables
  each of the four gates in _verify_claim individually and measures what each was
  holding back, classifying every admitted claim against gold rather than by
  judge.

hypothesis: >
  At least one gate cuts a non-trivial number of claims, splitting into warranted
  cuts (gold_absent) and false positives (gold_backed) with a small ambiguous
  residual for a later judged pass. REFUTED: every gate cuts zero, because the
  deterministic composer cannot construct a claim that violates one.

