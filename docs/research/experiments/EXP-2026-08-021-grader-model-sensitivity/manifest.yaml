# --- LLM / agentic block (delete entirely if no model was in the loop) ---
llm:
  # The reference pass being compared against is relay/UNDETERMINED@2026-08-19..21.
  # The serving model for that window is not recoverable, and is recorded as
  # unknown rather than guessed (D-009). It is a comment rather than a field
  # because the schema permits one model per run and this experiment compares two.
  model: "relay/qwen38-27B-v2@2026-08-31"   # alias `skynet`; identified by probe (scripts/model_identity.py), never by the alias -- D-028
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192          # doubled to 16384 on a parse failure, once, before recording an error
  prompt_files: []
  prompt_hash: null
  tool_schema_hash: null
  total_input_tokens: null
  total_output_tokens: null
  nondeterminism_note: >
    Temperature 0 is not determinism: greedy decoding still reduces floating
    point over whatever batch a request lands in, and the parse-failure path
    retries at double max_tokens and so grades a different request. Five
    complete grading sessions are therefore run and the spread is reported.
    The reference pass it is compared against has n=1 and an unidentified
    model, which is the defect this experiment exists to measure.

