id: EXP-2026-08-021
slug: grader-model-sensitivity
title: Does a judged comparison survive a change of grader model? The alias moved; the answers did not
status: running            # planned | running | complete | failed | superseded
date_started: 2026-08-31
date_completed: null       # null until status is complete/failed
authors: [brendondgr]

purpose: >
  Every judged figure from 2026-08-19 onward was graded through the relay alias
  `skynet`, and for EXP-2026-08-007/-008/-009 -- which carry C-012, C-021 and
  C-022 -- the serving model is not determinable (Q12, D-028). The alias now
  resolves to qwen38-27B-v2. Because the saved answers do not move, re-grading
  them changes exactly one variable, which makes grader-model sensitivity
  measurable for the first time. The recorded 0.0050 grader spread was measured
  WITHIN one model over three passes and bounds nothing about a model change.
  What must survive is arm ordering, not level; the level was never quotable.

hypothesis: >
  H1 arm ordering is preserved in every bank. H2 the between-model mean absolute
  delta exceeds the 0.0050 within-model spread by at least an order of magnitude.
  H3 C-012's margin survives -- deterministic minus llm_query stays positive and
  larger than the grader's own spread on both banks. H4 disagreement is larger on
  the weak arm than on the strong ones, because a grader has little room to
  disagree about an answer everything scores near 1.0. Recorded in PROTOCOL.md
  before any candidate judgment existed.

