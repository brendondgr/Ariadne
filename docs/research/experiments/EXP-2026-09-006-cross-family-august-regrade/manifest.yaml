id: EXP-2026-09-006
slug: cross-family-august-regrade
title: Does the August ordering survive a change of grader family? Two named graders, 510 frozen answers
status: running            # planned | running | complete | failed | superseded
date_started: 2026-09-05
date_completed: null       # null until status is complete/failed
authors: [brendondgr]

purpose: >
  C-021 and C-022 rest on judgments made in the 19-21 August window, when the
  model behind the relay alias is not determinable (Q12, D-028). EXP-2026-08-021
  repaired part of this by re-grading the two blind banks five times under the
  now-identified qwen38-27B-v2, leaving two gaps. First, everything so far is one
  family: those answers have survived a change of grading session, never a change
  of model family. Second, C-021's contrast was never re-graded at all -- its
  catalogue-versus-blind figure comes from composerfix-dev (120) and
  composerfix-holdout (30), and each of those 150 answers carries exactly one
  judgment sidecar written by the unidentified model. Nothing is re-run: the
  answers on disk are byte-identical to the ones the figures were computed over,
  so a difference between passes is attributable to the grader alone.

hypothesis: >
  H1 zero arm-ordering reversals on both blind banks under the second family.
  H2 C-021's catalogue-minus-blind gap stays positive and above 0.02 under both
  named graders. H3 C-022's margin remains indistinguishable from zero once the
  +/-0.06 question-sampling component at n=30 is applied. H4 the between-family
  offset exceeds the within-family spread (0.0036-0.0249) by at least an order of
  magnitude. H5 disagreement concentrates on the weak arm. All five recorded in
  PROTOCOL.md at 10:55 EDT, before any candidate judgment existed.

