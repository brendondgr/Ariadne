# --- LLM / agentic block (delete entirely if no model was in the loop) ---
llm:
  # Two graders, one manifest field. Both identified by probe from the response
  # envelope (scripts/model_identity.py), never from the alias -- D-028.
  #   second family : relay/gemma4-31B-mtp@2026-09-05   (alias default-model-2, 24 workers)
  #   same family   : relay/qwen38-27B-v2@2026-09-05    (alias default-model,   16 workers)
  # No model is in the ANSWERING path for any of these 510 answers; the model is
  # only in the metric.
  model: "relay/gemma4-31B-mtp@2026-09-05 + relay/qwen38-27B-v2@2026-09-05"
  temperature: 0.0
  top_p: 1.0
  max_tokens: 32768
  prompt_files: []
  prompt_hash: null
  tool_schema_hash: null
  total_input_tokens: null
  total_output_tokens: null
  nondeterminism_note: >
    Temperature 0 is not determinism: greedy decoding still reduces floating
    point over whatever batch a request lands in. Both grading positions are run
    and averaged per case before cases are averaged. Both graders run at the same
    32768 budget deliberately -- EXP-2026-08-021 found 7-8% of the largest
    answers fail to parse below it, and the failures land on the thorough
    answers, so a cheaper second pass would confound grader with budget.

