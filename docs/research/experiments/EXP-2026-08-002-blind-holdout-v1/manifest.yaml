id: EXP-2026-08-002
slug: blind-holdout-v1
title: Does the deterministic pipeline's near-ceiling correctness survive a blind, uniformly-sampled holdout?
status: complete
date_started: 2026-08-09
date_completed: 2026-08-09
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  The 120-question golden catalogue was written by the same person, at the same
  time, as the query templates that answer it, so its 0.9972 correctness figure
  cannot distinguish capability from coverage. This experiment measures the same
  two arms on 30 questions written by an author with no access to the template
  inventory, anchored on entities drawn uniformly by a committed seeded sampler,
  with gold computed independently from the raw MITRE snapshot. It is the
  evidence for C-013, which gates C-001.

hypothesis: >
  Pre-registered and directional. Blind correctness will be materially lower
  than the development figure; the informative quantity is the size of the drop
  and whether it is uniform across categories or concentrated in the categories
  whose original anchors were richest. No threshold was set here — the decision
  rule lives in the Branch A gate and was not renegotiated after the result.

