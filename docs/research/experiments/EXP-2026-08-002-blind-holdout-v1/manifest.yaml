  total_output_tokens: null
  nondeterminism_note: >
    The Author and the judge are provider-hosted and nondeterministic even at
    temperature 0; n_runs is 1, so no variance estimate is available for either.
    Arm A's pipeline is fully deterministic and would replay byte-identically.
    Arm F's is not. Intervals reported are sampling intervals over the 30
    questions, not run-to-run variance.

# --- Results block ---
metrics:
  primary: correctness
  values:
    arm_a_blind_correctness: {mean: 0.689, std: 0.0, n: 30}
    arm_a_dev_correctness: {mean: 0.9972, std: 0.0, n: 120}
    arm_f_blind_correctness: {mean: 0.7083, std: 0.0, n: 30}
    arm_f_dev_correctness: {mean: 0.9957, std: 0.0, n: 120}
    arm_a_blind_minus_dev: {mean: -0.3082, std: 0.0, n: 30}
    arm_f_blind_minus_dev: {mean: -0.2874, std: 0.0, n: 30}
    arm_a_federated_abstention_correctness: {mean: 0.825, std: 0.0, n: 4}
    arm_f_federated_abstention_correctness: {mean: 0.875, std: 0.0, n: 4}
    fabricated_mappings_both_arms: {mean: 0.0, std: 0.0, n: 8}
baselines_compared: ["EXP-2026-07-001", "EXP-2026-07-006"]
statistical_test: >
  Percentile bootstrap 95% CI over the 30 per-question correctness scores (2000
  resamples, seed 1729) for the continuous mean; Wilson score 95% interval for
  the CORRECT-verdict rate. No significance test between arms — n=30 with
  overlapping intervals does not support one.

