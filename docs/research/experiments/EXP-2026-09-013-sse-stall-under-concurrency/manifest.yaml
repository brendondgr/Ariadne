id: EXP-2026-09-013
slug: sse-stall-under-concurrency
title: How often does the workbench's SSE stream go silent long enough for the browser to cancel a run that is working?
status: complete
date_started: 2026-09-07
date_completed: 2026-09-07
authors: [brendondgr]

purpose: >
  An engineering measurement, not a paper result. The workbench's activity
  ticker stops on "planning and routing the question" roughly half the time
  with the llm drafter, and the operator's report was that the run never
  finishes. This measures the actual quantity involved — the longest the SSE
  socket goes quiet — because server-side success and analyst-visible success
  turned out to be different numbers, and no test in the suite can see the
  difference. It supports no CLAIMS.md entry; it exists so the fix has a
  before/after that is not a chat log.

hypothesis: >
  The pipeline emits nothing during its LLM stages, so the browser's 90 s
  inactivity watchdog (SSE_STALL_MS in web/lib/streamConfig.ts) cancels healthy
  runs. Predicted before measuring: the longest silences follow status(planning)
  and status(answering), and the affected fraction is near the "half the time"
  the operator reported.

