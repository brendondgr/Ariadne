# Filled by scripts/new_experiment.py, then completed by hand from the run's own
# artifacts. Every number below was read from a file listed in data/POINTERS.md.
# Nothing here was transcribed from the morning report's prose.
id: EXP-2026-09-002
slug: expansion-bank-judged
title: On a bank covering every shape the sources support, do hand-written templates still hold?
status: superseded       # A-1 (2026-09-09): headline arm comparison re-measured after the retrieval repairs by EXP-2026-09-005 (0.1642 -> 0.1623)
date_started: 2026-09-02
date_completed: 2026-09-03
authors: ["brendondgr"]

purpose: >
  EXP-2026-09-001 A-5 scored the 572-question expansion bank with no grader and
  reported retrieval recall only. That leaves the study's primary comparison —
  C-023, hand-written templates against schema-derived construction — measured
  on the catalogue at a saturated ceiling (0.0000 gap, EXP-2026-08-015) and on a
  foreign schema (-0.6121). This experiment supplies the missing middle: the
  same contrast, judged, on the templates' OWN schema, over a bank that reaches
  34 edge types instead of 12. It also carries a third arm in which a model
  writes the query, bearing on C-012.

hypothesis: >
  Stated in docs/plans/2026-09-02-overnight-expansion-run.md before the run.
  Templates and the schema-derived generic path were expected to remain close on
  ATT&CK/CAPEC, as they are on the catalogue, because this is the schema the
  templates were written for; the coverage cost of templates was expected to
  appear only off-schema. Falsifiable in both directions: a gap on the home
  schema would mean the catalogue's 0.0000 was a property of the question set
  rather than of the schema.

