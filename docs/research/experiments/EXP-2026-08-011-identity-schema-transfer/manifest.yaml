id: EXP-2026-08-011
slug: identity-schema-transfer
title: Does the schema-agnostic path work on a schema it has never seen?
status: planned          # planned | running | complete | failed | superseded
date_started: 2026-08-21
date_completed: null
authors: ["brendondgr"]

purpose: >
  C-010 says the dataset-specific surface is bounded and countable and the
  schema-agnostic machinery transfers. It is marked supported on the strength of
  EXP-2026-07-011, an audit whose own threats section states that no non-MITRE
  dataset was ever loaded and that a code reading misses run-time coupling.
  ReliaQuest has supplied the catalog of their production customer graph -- 72
  node types, 21 edge labels, 60 typed triples, 779 node and 118 edge
  attributes, and zero customer records -- which is the first foreign schema
  this codebase has had access to. This experiment loads it, generates a
  catalog-conformant synthetic tenant, and runs the existing blind-bank
  machinery against it, converting C-010 from a reading into a measurement. It
  also bears on C-014, whose blind metric is recorded as saturated and unable to
  detect anything further on the MITRE banks.

hypothesis: >
  Pre-registered in PROTOCOL.md. (H1) The schema-derived primitives arm retrieves
  within 0.10 of its MITRE blind figure, so >= 0.90. (H2) The template cascade
  scores below 0.40, and the arm gap is the dataset-specific surface measured at
  run time rather than counted by an AST parse. (H3) Retrieval on the eight
  same-label-both-ends triples falls at least 0.20 below heterogeneous-label
  triples, because a PlausibleFacet's neighbour_label carries no disambiguating
  signal when both endpoints share a label -- a failure mode MITRE structurally
  cannot exercise. (H4) More than 50% of node properties learn as open, so the
  binding guard cannot fire; and the honesty property holds with zero false
  mismatches.

