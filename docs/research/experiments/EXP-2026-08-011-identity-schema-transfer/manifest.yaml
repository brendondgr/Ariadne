# --- LLM / agentic block ---
# The PRIMARY metric takes no model: both arms plan, query and compose
# deterministically, so the retrieval result is byte-reproducible. A model
# appears at exactly two points -- authoring the question bank (step 7) and
# grading the persisted answers (step 9) -- and neither is in the answer path.
llm:
  model: "relay/unknown@2026-08-21 (bank 1–2 authoring, A-6 local judging); claude-sonnet agents (A-7/A-9/A-10 judging); claude-fable (bank 3 authoring)"   # served model behind the relay alias unrecorded (I-17)
  temperature: 0.0
  top_p: 1.0
  max_tokens: 32768
  prompt_files: []
  prompt_hash: null
  tool_schema_hash: null
  total_input_tokens: null
  total_output_tokens: null
  nondeterminism_note: >
    Provider-side nondeterminism remains even at temperature 0. It cannot reach
    the primary metric, which runs with no model in the loop; it reaches only
    the authored bank (fixed once and committed) and the judged secondary.

