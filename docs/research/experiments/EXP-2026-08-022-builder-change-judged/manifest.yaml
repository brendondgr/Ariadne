id: EXP-2026-08-022
slug: builder-change-judged
title: Is the shipped builder change an improvement, judged, on the two banks its own regression check missed?
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-08-31
date_completed: 2026-08-31
authors: [brendondgr]

purpose: >
  9f02dc6 flipped ARIADNE_LEXICON and ARIADNE_EXACTNAME on and moved name
  resolution to the top of build(). Its regression evidence covers the
  120-question catalogue and the variant bank, not the two fresh banks -- and
  those carry C-012, C-021 and C-022. Re-running the deterministic arm at HEAD
  showed 31 of 60 answers changed, almost all in text with retrieval identical,
  and rendering is what a judge scores. This asks whether that is better, worse,
  or invisible.

hypothesis: >
  H1 the byte-identical answers, used as a null control, show a signed
  difference of about zero. H2 the new builder is not worse. H3 any movement is
  confined to the changed answers and exceeds the null floor. H4 among changed
  answers more improve than regress. Recorded in PROTOCOL.md before any
  new-builder answer was graded.

