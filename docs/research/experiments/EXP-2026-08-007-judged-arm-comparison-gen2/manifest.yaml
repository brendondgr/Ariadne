id: EXP-2026-08-007
slug: judged-arm-comparison-gen2
title: Judged, at last — does the repaired cascade answer better, and do the generic and LLM-loop arms differ from it on anything that matters?
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-08-19
date_completed: 2026-08-19
authors: ["brendondgr", "Claude Opus 5"]

purpose: >
  EXP-2026-08-004 through -006 moved blind retrieval 0.7688 → 0.8952 → 1.0000
  and every one of them closed with the same admission: nothing was judged.
  Retrieval saturating says the evidence arrived, not that the answer was
  written. This runs the whole judged chain unattended — a calibrated grader,
  three arms on both banks, three repeat passes for grader variance, and Arm F
  regenerated on the post-fix tree — so the arm comparison finally rests on
  correctness rather than coverage. Bears on C-001, C-003, C-013, C-014, C-017
  and answers Q2.

hypothesis: >
  Stated in EXP-2026-08-006 RESULTS §5 before this ran: retrieval is saturated
  on both banks and can no longer detect anything, so a judged re-run is the
  only instrument left. No prior hypothesis was recorded for the arm ordering —
  that half is exploratory.

