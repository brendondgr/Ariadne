    Provider-side nondeterminism remains even at temperature 0. Rather than
    report mean ± std over n_runs of the pipeline, this experiment measures
    grader variance directly: three judge passes over one fixed set of
    deterministic answers, spread 0.0050. The pipeline itself ran once per arm.
    The relay's upstream for `skynet` on the night of the run was recorded
    from recollection as qwen38-27B-awq (ISSUES §8); no artifact corroborates
