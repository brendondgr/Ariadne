id: EXP-2026-11-020
slug: era2-shape-count
title: "Era 2 Step 9 Phase A: which retrieval operators do the available questions need? (shape census of own banks, AttackQA, CTIBench)"
status: complete            # planned | running | complete | failed | superseded
date_started: 2026-11-20
date_completed: 2026-11-20
authors: ["brendondgr", "Claude Opus 5.5"]

purpose: >
  Step 9 builds retrieval operators. Before building, count which operations the questions this project can use actually need: Ariadne's own banks (labelled by code from their structured specs) and two external benchmarks plus Step 6's out-of-coverage questions (labelled by two model labellers against a written rubric, 20% double-labelled). It orders the operator work, weights Phase G's probe set, and decides whether Mind the Query's three gaps are built. Engineering census; no paper claim.

hypothesis: >
  H1: today's operations cover >= 0.98 of own banks. H2: on AttackQA weighted, O4.verify >= 0.40; O2/O3/O6/O7/O8 together < 0.02; outside retrieval 0.10-0.35. H3: each gap < 2% of external retrieval questions, so none is built. H4: every cti-ate row is X.extract.

