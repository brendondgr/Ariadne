# The model registry (Era 2, Step 2): every model a test may use.
#
# A name here is a *registry name*, not a relay alias. The alias is how the
# model is reached; the identity block is how we know what answered. On
# 2026-11-14 and again on 2026-11-15 the relay's aliases and its envelope names
# were both swapped against the operator's description, so neither is evidence.
# Identity is the tokenizer's end-of-turn id on a plain reply
# (``return_token_ids``; Qwen 3.5 family <|im_end|> = 248046), plus the probe's
# rendered prompt ids where two models share that id. A reply that ends in a
# tool call ends on another token, which is why identity is a separate probe
# and not read off each row.
#
# Gemma 4 31B (token 106) served Era 2 Steps 2-3, was retired 2026-11-15, and is
# open again from 2026-11-18 (operator): :9090 default-model = Gemma 4 31B,
# default-model-2 = Qwen 3.8 27B, 16 concurrent each. Qwen stays the default and
# the planner of record; Gemma is a replication arm (EXP-2026-11-015).
#
# Unknown values are null, never guessed. Fill them from the operator.

defaults:
  # A generous cap, plus the runaway check. The local models are reasoning
  # models; small caps truncate to an empty reply that looks like an outage.
  max_tokens: 16384
  long_max_tokens: 32768
  # Qwen 3.8 27B (:9090 default-model-2 from 2026-11-18) is the default. Every
  # era-2 step uses it unless told otherwise.
  default_model: qwen38-27b
  # Off. When a caller turns it on, the reply records both models and every
  # experiment runner refuses rows that fell back.
  fallback: null
  connect_timeout_s: 3.0
  # A stall limit while streaming, not a wall clock.
  read_timeout_s: 600.0

models:
  # Operator, 2026-11-15: :9090 default-model now serves MiniCPM 4.7 35B and
  # takes at least 32 concurrent requests (measured that day: 32 and 64 at once,
  # all answered). Probed 2026-11-15:
  # - the reply ends on 248046, the same end-of-turn id as Qwen 3.8 27B (a
  #   Qwen-3.5-family tokenizer), so the end-of-turn id alone cannot tell them
  #   apart. The identity probe's rendered prompt ids are a second check; they
  #   separate the two only if the chat templates differ. The operator's word
  #   (2026-11-15) is the evidence that this is MiniCPM.
  # - the template opens <think> (248068) in the prompt; a short reply that never
  #   closes it (no 248069) is filed whole under "reasoning" by the server, which
  #   toolcalls re-asks with thinking off (logged as unclosed_think_retry). It is
  #   NOT confined to one-word answers: on CypherBench query writing it hit 222 of
  #   800 replies (66% of Gremlin replies), EXP-2026-11-010. There, thinking-off
  #   answers were much weaker (free Cypher 0.50 vs 0.80 recovered), so for this
  #   model the re-ask is the worse fix.
  # - On query writing it is clearly weaker than Qwen 3.8 27B (EXP-2026-11-010:
  #   typed3 -0.22, free Cypher -0.11; -0.135 / -0.06 with misfiled replies
  #   recovered).
  # - reasoning_effort "none" turns thinking off (47 vs 786 tokens on one
  #   question); "low" changed nothing, so only "none" is listed.
  # - native tool calls work.
  minicpm47-35b:
    kind: llm
    endpoint: http://localhost:9090/v1
    alias: default-model           # envelope answers "default-model"
    identity:
      stop_token_id: 248046
      family: minicpm (Qwen-3.5-family tokenizer)
      prompt_fingerprint: [248045, 846, 198, 20206, 440, 279, 3299, 5226, 13, 248046, 198, 248045, 74455, 198, 248068, 198]
    size: "35B"
    licence: null
    context_window: null
    reasoning: {param: reasoning_effort, values: [none], default: null, thinking_off: "none", think_close_token_id: 248069}
    tool_calls: {native: true, grammar_constrained: false}
    status: closed                 # replaced by Qwen 3.8 27B on 2026-11-16 (EXP-2026-11-010)
    max_concurrency: 32
    notes: "Served 2026-11-15 only. Thinking on by default; pass reasoning_effort=none to turn it off."


  # Back on :9090 default-model from 2026-11-16 (operator), after EXP-2026-11-010
  # found MiniCPM 4.7 35B clearly weaker. Identified 2026-11-16: end-of-turn
  # 248046, and the server's default rendering injects the system prompt
  # "Reasoning effort is set to xhigh..." (the fingerprint below), which MiniCPM's
  # did not. At reasoning_effort=medium the two render identically, so identity
  # is probed at the default. Closes its think block: 10 of 10 one-word prompts
  # answered as content at medium.
  qwen38-27b:
    kind: llm
    endpoint: http://localhost:9090/v1
    alias: default-model-2         # operator 2026-11-18 (default-model 2026-11-14 to 11-17)
    identity:
      stop_token_id: 248046
      family: qwen3.5
      prompt_fingerprint: [248045, 8678, 198, 24342, 286, 4879, 369, 716, 310, 830, 11553, 13, 5044, 1683, 15060, 1472, 279, 3274, 11, 9307, 1328, 30800, 11, 2814, 47675, 25605, 11, 321, 60445, 55404, 11, 27224, 11, 321, 30246, 303, 279, 1534, 4087, 13, 248046, 198, 248045, 846, 198, 20206, 440, 279, 3299, 5226, 13, 248046, 198, 248045, 74455, 198, 248068, 198]
    size: "27B"
    licence: null
    context_window: null
    # The server's default is xhigh, which thinks until an 8,192-token cap on
    # long prompts; EXP-2026-11-006 ran every arm at medium, and so does every
    # caller unless it says otherwise.
    reasoning: {param: reasoning_effort, values: [xhigh, medium, low, none], default: medium, thinking_off: "none", think_close_token_id: 248069}
    tool_calls: {native: true, grammar_constrained: false}
    status: open
    # Operator, 2026-11-18: 16 at a time.
    max_concurrency: 16
    notes: "Native tool calls through vLLM (checked 2026-11-15 under default-model-2)."

  # Back on :9090 default-model from 2026-11-18 (operator), beside Qwen.
  gemma4-31b:
    kind: llm
    endpoint: http://localhost:9090/v1
    alias: default-model
    identity: {stop_token_id: 106, family: gemma}
    size: "31B dense"
    licence: null
    context_window: null
    reasoning: {param: null, values: [], default: null}
    tool_calls: {native: true, grammar_constrained: false}
    status: open
    max_concurrency: 16
    notes: "Served Era 2 Steps 2-3; retired 2026-11-15; reopened 2026-11-18 as a replication arm."

  # Decision models answer multiple-choice, yes/no or score questions with a
  # probability per option and no generated text. Two servers (user, 2026-11-16).
  # The registry's token-id identity check does not apply to them.
  pplx-decider:
    kind: decision
    endpoint: http://localhost:7500
    alias: null
    identity: null                 # no token ids: the decisions protocol has none
    size: null
    licence: null
    context_window: null
    reasoning: {param: null, values: [], default: null}
    tool_calls: {native: false, grammar_constrained: false}
    status: open                   # answering on 2026-11-16 (0.21 s for one 2-option choice)
    notes: >
      vLLM decision server on :7500. POST /v1/decisions {"state", "questions": {name: {"type": "choice",
      "criteria": {key: description}}}} -> answers.<name>.probabilities; several questions batch in one
      request. Client: utils/killtests/decider.py.

  d3-lite:
    kind: decision
    endpoint: http://localhost:5107
    alias: null
    identity: null
    size: "0.85B"
    licence: apache-2.0
    context_window: null
    reasoning: {param: null, values: [], default: null}
    tool_calls: {native: false, grammar_constrained: false}
    status: open
    notes: >
      GAIFA's decide service on :5107 (vllm-sr/d3-lite, revision 03560c26). POST /v1/decide {"input",
      "questions": [{"id", "type": yesno|choice|score, "question", "options"}]} -> per-option probabilities
      and p (the top answer's); its tuned trust threshold is 0.35. Loads on first use (about 7.7 GB of
      GPU memory). No client in this repository yet.
