[project]
name = "ariadne"
version = "0.1.0"
description = "Federated agentic cybersecurity knowledge graph prototype (ReliaQuest Challenge Three)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
read-skills = "utils.skills.read_yaml:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
