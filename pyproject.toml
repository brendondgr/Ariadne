[project]
name = "ariadne"
version = "0.1.0"
description = "Federated agentic cybersecurity knowledge graph prototype (ReliaQuest Challenge Three)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.32.3",
    "pytest>=8.3.5",
    "neo4j>=6.2.0",
    "gremlinpython>=3.7.0",
    "python-dotenv>=1.2.2",
    "ipykernel>=7.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "langgraph>=1.0",
    "langchain-core>=1.4.8",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require the live Docker graph stack (Neo4j/Gremlin)",
    "live: tests that query the live Docker graph stack and skip when unreachable",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "api"]
